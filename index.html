<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RP Department - Mobile Data Terminal (MDT)</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0f172a;
      --bg-card: #1e293b;
      --bg-card-hover: #334155;
      --accent-blue: #3b82f6;
      --accent-blue-hover: #2563eb;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --success: #10b981;
      --warning: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Navbar Header */
    header {
      background-color: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand { display: flex; align-items: center; gap: 0.75rem; font-weight: 700; font-size: 1.25rem; letter-spacing: 0.5px; }
    .brand-badge { background: var(--accent-blue); padding: 0.25rem 0.6rem; border-radius: 4px; font-size: 0.75rem; font-family: 'JetBrains Mono', monospace; }
    
    .status-pill {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      background: rgba(16, 185, 129, 0.1);
      color: var(--success);
      padding: 0.35rem 0.75rem;
      border-radius: 20px;
      border: 1px solid rgba(16, 185, 129, 0.2);
    }
    .status-dot { width: 8px; height: 8px; background-color: var(--success); border-radius: 50%; }

    /* Main Container */
    main {
      flex: 1;
      padding: 2rem;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    /* Search & Action Bar */
    .controls-bar {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }
    .search-box {
      flex: 1;
      min-width: 300px;
      position: relative;
    }
    .search-input {
      width: 100%;
      padding: 0.75rem 1rem 0.75rem 2.5rem;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-input:focus { border-color: var(--accent-blue); }
    .search-icon { position: absolute; left: 0.85rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.25rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      border: none;
      transition: background-color 0.2s;
    }
    .btn-primary { background-color: var(--accent-blue); color: white; }
    .btn-primary:hover { background-color: var(--accent-blue-hover); }
    .btn-secondary { background-color: var(--bg-card); color: var(--text-main); border: 1px solid var(--border-color); }
    .btn-secondary:hover { background-color: var(--bg-card-hover); }
    .btn-danger { background-color: var(--danger); color: white; }
    .btn-danger:hover { background-color: var(--danger-hover); }

    /* Navigation Tabs */
    .tabs { display: flex; gap: 0.5rem; border-bottom: 1px solid var(--border-color); margin-bottom: 1.5rem; }
    .tab {
      padding: 0.75rem 1.25rem;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      color: var(--text-muted);
      font-weight: 500;
      transition: all 0.2s;
    }
    .tab.active { border-bottom-color: var(--accent-blue); color: var(--text-main); font-weight: 600; }

    /* Grid Views */
    .view-panel { display: none; }
    .view-panel.active { display: block; }

    .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.5rem; }
    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, border-color 0.2s;
    }
    .card:hover { transform: translateY(-2px); border-color: var(--accent-blue); }

    .card-header { padding: 1.25rem; display: flex; gap: 1rem; align-items: center; border-bottom: 1px solid var(--border-color); }
    .civilian-avatar { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; background-color: var(--bg-dark); }
    .civilian-info h3 { font-size: 1.1rem; margin-bottom: 0.25rem; }
    
    .card-body { padding: 1.25rem; flex: 1; display: flex; flex-direction: column; gap: 0.75rem; font-size: 0.9rem; }
    .info-row { display: flex; justify-content: space-between; }
    .info-label { color: var(--text-muted); }
    .info-value { font-weight: 500; }

    .card-actions { padding: 1rem 1.25rem; background-color: rgba(0,0,0,0.15); border-top: 1px solid var(--border-color); display: flex; gap: 0.5rem; justify-content: flex-end; }

    /* Table View for Incidents */
    .table-container { background: var(--bg-card); border-radius: 12px; border: 1px solid var(--border-color); overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
    th, td { padding: 1rem; border-bottom: 1px solid var(--border-color); }
    th { background: rgba(0,0,0,0.2); color: var(--text-muted); font-weight: 600; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.5px; }
    tr:hover { background-color: var(--bg-card-hover); }

    /* Modal / Dialog Component */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .modal-overlay.open { opacity: 1; pointer-events: auto; }
    .modal {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      width: 100%;
      max-width: 550px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 1.75rem;
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
    .modal-close { background: none; border: none; color: var(--text-muted); font-size: 1.5rem; cursor: pointer; }

    .form-group { margin-bottom: 1.25rem; }
    .form-label { display: block; margin-bottom: 0.5rem; font-size: 0.85rem; color: var(--text-muted); font-weight: 500; }
    .form-control {
      width: 100%;
      padding: 0.75rem;
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-main);
      outline: none;
      font-size: 0.9rem;
    }
    .form-control:focus { border-color: var(--accent-blue); }
    textarea.form-control { resize: vertical; min-height: 100px; }

    /* Empty & Loading States */
    .empty-state { text-align: center; padding: 4rem 2rem; color: var(--text-muted); }
  </style>
</head>
<body>

  <!-- Top Navigation Header -->
  <header>
    <div class="brand">
      <span>STATE DATABASE</span>
      <span class="brand-badge">MDT v2.4</span>
    </div>
    <div class="status-pill">
      <div class="status-dot"></div>
      <span id="connection-status">Connected to NocoDB</span>
    </div>
  </header>

  <!-- Main Container -->
  <main>
    <!-- Top Search & Actions Bar -->
    <div class="controls-bar">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="global-search" class="search-input" placeholder="Search Civilians by Full Name, Roblox or Discord username..." oninput="handleSearch()">
      </div>
      <button class="btn btn-primary" onclick="openAddCivilianModal()">+ Add Civilian</button>
      <button class="btn btn-primary" onclick="openAddIncidentModal()">+ File Record</button>
    </div>

    <!-- Navigation Tabs -->
    <div class="tabs">
      <div class="tab active" onclick="switchTab('civilians')">Civilian Profiles (<span id="civ-count">0</span>)</div>
      <div class="tab" onclick="switchTab('incidents')">Incident Records (<span id="inc-count">0</span>)</div>
    </div>

    <!-- Civilian View Panel -->
    <div id="view-civilians" class="view-panel active">
      <div id="civilians-grid" class="cards-grid">
        <!-- Civilian Cards Injected via JavaScript -->
      </div>
    </div>

    <!-- Incidents View Panel -->
    <div id="view-incidents" class="view-panel">
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Incident Title</th>
              <th>Civilian</th>
              <th>Reporting Officer</th>
              <th>Type</th>
              <th>Fine / Bond</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="incidents-table-body">
            <!-- Incident Rows Injected via JavaScript -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Modal: Add / Edit Civilian -->
  <div id="modal-civilian" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-civilian-title">Add Civilian Profile</h3>
        <button class="modal-close" onclick="closeModal('modal-civilian')">&times;</button>
      </div>
      <form id="form-civilian" onsubmit="saveCivilian(event)">
        <input type="hidden" id="civ-id">
        <div class="form-group">
          <label class="form-label">Full Name *</label>
          <input type="text" id="civ-fullname" class="form-control" required placeholder="e.g. John Doe">
        </div>
        <div class="form-group">
          <label class="form-label">Roblox Username (Optional)</label>
          <input type="text" id="civ-roblox" class="form-control" placeholder="e.g. RobloxPlayer123">
        </div>
        <div class="form-group">
          <label class="form-label">Discord Username (Optional)</label>
          <input type="text" id="civ-discord" class="form-control" placeholder="e.g. user#0001">
        </div>
        <div class="form-group">
          <label class="form-label">Photo URL</label>
          <input type="url" id="civ-photo" class="form-control" placeholder="https://example.com/photo.jpg">
        </div>
        <div class="form-group">
          <label class="form-label">Owned Vehicles</label>
          <input type="text" id="civ-vehicles" class="form-control" placeholder="e.g. Black Sultan (ABC-1234), Red Cruiser">
        </div>
        <div style="display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 1.5rem;">
          <button type="button" class="btn btn-secondary" onclick="closeModal('modal-civilian')">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Profile</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: Add / Edit Incident Record -->
  <div id="modal-incident" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-incident-title">File New Record</h3>
        <button class="modal-close" onclick="closeModal('modal-incident')">&times;</button>
      </div>
      <form id="form-incident" onsubmit="saveIncident(event)">
        <input type="hidden" id="inc-id">
        <div class="form-group">
          <label class="form-label">Incident Title *</label>
          <input type="text" id="inc-title" class="form-control" required placeholder="e.g. Speeding / Evading Traffic Stop">
        </div>
        <div class="form-group">
          <label class="form-label">Civilian Name *</label>
          <input type="text" id="inc-civilian" class="form-control" required placeholder="Select or type Civilian Full Name">
        </div>
        <div class="form-group">
          <label class="form-label">Reporting Officer *</label>
          <input type="text" id="inc-officer" class="form-control" required placeholder="e.g. Officer Miller">
        </div>
        <div class="form-group">
          <label class="form-label">Details / Narrative</label>
          <textarea id="inc-details" class="form-control" placeholder="Provide full incident details..."></textarea>
        </div>
        <div style="display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 1.5rem;">
          <button type="button" class="btn btn-secondary" onclick="closeModal('modal-incident')">Cancel</button>
          <button type="submit" class="btn btn-primary">File Record</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    /* -------------------------------------------------------------
       1. NocoDB API CONFIGURATION (Pre-filled with your Base & Table IDs)
    ------------------------------------------------------------- */
    const API_CONFIG = {
      BASE_URL: 'https://app.nocodb.com/api/v2/tables',
      AUTH_TOKEN: 'nc_pat_Um3j8Q3N2oUQ4b2FsabzrCOsw6FMtAQEFWtFm4CE', // Paste your API token from NocoDB Account Settings
      CITIZENS_ENDPOINT: '/mp0kwao6xpss118/records', // Civilians Table ID
      INCIDENTS_ENDPOINT: '/mp6oaqbr190kp1x/records'  // Records Table ID
    };

    // Global In-Memory Data Store
    let state = {
      civilians: [],
      incidents: [],
      searchQuery: '',
      activeTab: 'civilians'
    };

    // On Page Load: Fetch Data from NocoDB API
    document.addEventListener('DOMContentLoaded', () => {
      fetchData();
    });

    /* -------------------------------------------------------------
       2. API FETCH & SYNC FUNCTIONS
    ------------------------------------------------------------- */
    async function fetchData() {
      // Fallback to Mock Data if API Token hasn't been pasted yet
      if (API_CONFIG.AUTH_TOKEN === 'PASTE_YOUR_NOCODB_TOKEN_HERE') {
        document.getElementById('connection-status').textContent = 'Demo Mode (Add NocoDB Token)';
        document.getElementById('connection-status').style.color = '#f59e0b';
        loadMockData();
        return;
      }

      try {
        const headers = { 'xc-token': API_CONFIG.AUTH_TOKEN, 'Content-Type': 'application/json' };

        // Parallel Fetch for Civilians & Incidents
        const [civRes, incRes] = await Promise.all([
          fetch(`${API_CONFIG.BASE_URL}${API_CONFIG.CITIZENS_ENDPOINT}`, { headers }),
          fetch(`${API_CONFIG.BASE_URL}${API_CONFIG.INCIDENTS_ENDPOINT}`, { headers })
        ]);

        if (civRes.ok && incRes.ok) {
          const civData = await civRes.json();
          const incData = await incRes.json();

          // Transform NocoDB JSON into Clean Internal Objects
          state.civilians = (civData.list || []).map(row => ({
            id: row.Id,
            fullName: row['Full name'] || 'Unknown',
            robloxUsername: row['Roblox username'] || '',
            discordUsername: row['Discord username'] || '',
            photo: row['Photo'] || 'https://via.placeholder.com/150/1e293b/94a3b8?text=No+Photo',
            vehicles: row['Vehicles'] || 'None registered'
          }));

          state.incidents = (incData.list || []).map(row => ({
            id: row.Id,
            title: row['Incident Title'] || 'Untitled Incident',
            civilian: row['Civilian'] || 'N/A',
            officer: row['Reporting Officer'] || 'N/A',
            type: row['Type'] || 'General',
            fineAmount: row['Fine/Bond Amount'] || '$0',
            details: row['Details'] || ''
          }));

          document.getElementById('connection-status').textContent = 'Connected to NocoDB';
        }
      } catch (err) {
        console.error('NocoDB Sync Error:', err);
        document.getElementById('connection-status').textContent = 'Connection Error (Using Local Data)';
      }

      render();
    }

    /* -------------------------------------------------------------
       3. UI RENDERING FUNCTIONS
    ------------------------------------------------------------- */
    function render() {
      renderCivilians();
      renderIncidents();
      document.getElementById('civ-count').textContent = state.civilians.length;
      document.getElementById('inc-count').textContent = state.incidents.length;
    }

    function renderCivilians() {
      const container = document.getElementById('civilians-grid');
      const filtered = state.civilians.filter(c => 
        c.fullName.toLowerCase().includes(state.searchQuery.toLowerCase()) ||
        c.robloxUsername.toLowerCase().includes(state.searchQuery.toLowerCase()) ||
        c.discordUsername.toLowerCase().includes(state.searchQuery.toLowerCase())
      );

      if (filtered.length === 0) {
        container.innerHTML = `<div class="empty-state">No civilian profiles found matching your search.</div>`;
        return;
      }

      container.innerHTML = filtered.map(c => `
        <div class="card">
          <div class="card-header">
            <img src="${c.photo}" class="civilian-avatar" alt="${c.fullName}" onerror="this.src='https://via.placeholder.com/150/1e293b/94a3b8?text=No+Photo'">
            <div class="civilian-info">
              <h3>${c.fullName}</h3>
              <span style="color: var(--text-muted); font-size: 0.8rem;">Roblox: ${c.robloxUsername || 'N/A'}</span>
            </div>
          </div>
          <div class="card-body">
            <div class="info-row">
              <span class="info-label">Discord:</span>
              <span class="info-value">${c.discordUsername || 'N/A'}</span>
            </div>
            <div class="info-row">
              <span class="info-label">Vehicles:</span>
              <span class="info-value" style="text-align: right; max-width: 180px;">${c.vehicles}</span>
            </div>
          </div>
          <div class="card-actions">
            <button class="btn btn-secondary" onclick="editCivilian('${c.id}')">Edit Profile</button>
            <button class="btn btn-danger" onclick="deleteCivilian('${c.id}')">Delete</button>
          </div>
        </div>
      `).join('');
    }

    function renderIncidents() {
      const container = document.getElementById('incidents-table-body');
      const filtered = state.incidents.filter(i => 
        i.title.toLowerCase().includes(state.searchQuery.toLowerCase()) ||
        i.civilian.toLowerCase().includes(state.searchQuery.toLowerCase()) ||
        i.officer.toLowerCase().includes(state.searchQuery.toLowerCase())
      );

      if (filtered.length === 0) {
        container.innerHTML = `<tr><td colspan="6" class="empty-state">No incident records found.</td></tr>`;
        return;
      }

      container.innerHTML = filtered.map(i => `
        <tr>
          <td><strong>${i.title}</strong></td>
          <td>${i.civilian}</td>
          <td>${i.officer}</td>
          <td><span style="background: rgba(59,130,246,0.15); color: var(--accent-blue); padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.8rem;">${i.type}</span></td>
          <td>${i.fineAmount}</td>
          <td>
            <button class="btn btn-secondary" style="padding: 0.35rem 0.65rem; font-size: 0.8rem;" onclick="deleteIncident('${i.id}')">Delete</button>
          </td>
        </tr>
      `).join('');
    }

    /* -------------------------------------------------------------
       4. INTERACTION & FORM HANDLERS
    ------------------------------------------------------------- */
    function handleSearch() {
      state.searchQuery = document.getElementById('global-search').value;
      render();
    }

    function switchTab(tab) {
      state.activeTab = tab;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));

      if (tab === 'civilians') {
        document.querySelectorAll('.tab')[0].classList.add('active');
        document.getElementById('view-civilians').classList.add('active');
      } else {
        document.querySelectorAll('.tab')[1].classList.add('active');
        document.getElementById('view-incidents').classList.add('active');
      }
    }

    // Modal Control
    function openAddCivilianModal() {
      document.getElementById('form-civilian').reset();
      document.getElementById('civ-id').value = '';
      document.getElementById('modal-civilian-title').textContent = 'Add Civilian Profile';
      document.getElementById('modal-civilian').classList.add('open');
    }

    function openAddIncidentModal() {
      document.getElementById('form-incident').reset();
      document.getElementById('inc-id').value = '';
      document.getElementById('modal-incident').classList.add('open');
    }

    function closeModal(modalId) {
      document.getElementById(modalId).classList.remove('open');
    }

    // Add / Edit Civilian Logic
    async function saveCivilian(e) {
      e.preventDefault();
      const id = document.getElementById('civ-id').value;
      
      const payload = {
        "Full name": document.getElementById('civ-fullname').value,
        "Roblox username": document.getElementById('civ-roblox').value,
        "Discord username": document.getElementById('civ-discord').value,
        "Photo": document.getElementById('civ-photo').value,
        "Vehicles": document.getElementById('civ-vehicles').value
      };

      if (API_CONFIG.AUTH_TOKEN !== 'PASTE_YOUR_NOCODB_TOKEN_HERE') {
        const url = id 
          ? `${API_CONFIG.BASE_URL}${API_CONFIG.CITIZENS_ENDPOINT}/${id}`
          : `${API_CONFIG.BASE_URL}${API_CONFIG.CITIZENS_ENDPOINT}`;
        
        await fetch(url, {
          method: id ? 'PATCH' : 'POST',
          headers: { 'xc-token': API_CONFIG.AUTH_TOKEN, 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        fetchData();
      } else {
        // Local Fallback Mode
        if (id) {
          const index = state.civilians.findIndex(c => c.id === id);
          if (index !== -1) state.civilians[index] = { id, fullName: payload["Full name"], robloxUsername: payload["Roblox username"], discordUsername: payload["Discord username"], photo: payload["Photo"], vehicles: payload["Vehicles"] };
        } else {
          state.civilians.push({ id: Date.now().toString(), fullName: payload["Full name"], robloxUsername: payload["Roblox username"], discordUsername: payload["Discord username"], photo: payload["Photo"], vehicles: payload["Vehicles"] });
        }
        render();
      }

      closeModal('modal-civilian');
    }

    function editCivilian(id) {
      const civ = state.civilians.find(c => c.id === id);
      if (!civ) return;

      document.getElementById('civ-id').value = civ.id;
      document.getElementById('civ-fullname').value = civ.fullName;
      document.getElementById('civ-roblox').value = civ.robloxUsername;
      document.getElementById('civ-discord').value = civ.discordUsername;
      document.getElementById('civ-photo').value = civ.photo;
      document.getElementById('civ-vehicles').value = civ.vehicles;

      document.getElementById('modal-civilian-title').textContent = 'Edit Civilian Profile';
      document.getElementById('modal-civilian').classList.add('open');
    }

    async function deleteCivilian(id) {
      if (!confirm('Are you sure you want to delete this civilian record?')) return;

      if (API_CONFIG.AUTH_TOKEN !== 'PASTE_YOUR_NOCODB_TOKEN_HERE') {
        await fetch(`${API_CONFIG.BASE_URL}${API_CONFIG.CITIZENS_ENDPOINT}/${id}`, {
          method: 'DELETE',
          headers: { 'xc-token': API_CONFIG.AUTH_TOKEN }
        });
        fetchData();
      } else {
        state.civilians = state.civilians.filter(c => c.id !== id);
        render();
      }
    }

    // Save Incident Record
    async function saveIncident(e) {
      e.preventDefault();

      const payload = {
        "Incident Title": document.getElementById('inc-title').value,
        "Civilian": document.getElementById('inc-civilian').value,
        "Reporting Officer": document.getElementById('inc-officer').value,
        "Details": document.getElementById('inc-details').value
      };

      if (API_CONFIG.AUTH_TOKEN !== 'PASTE_YOUR_NOCODB_TOKEN_HERE') {
        await fetch(`${API_CONFIG.BASE_URL}${API_CONFIG.INCIDENTS_ENDPOINT}`, {
          method: 'POST',
          headers: { 'xc-token': API_CONFIG.AUTH_TOKEN, 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        fetchData();
      } else {
        state.incidents.push({
          id: Date.now().toString(),
          title: payload["Incident Title"],
          civilian: payload["Civilian"],
          officer: payload["Reporting Officer"],
          type: 'General',
          fineAmount: '$0',
          details: payload["Details"]
        });
        render();
      }

      closeModal('modal-incident');
    }

    async function deleteIncident(id) {
      if (!confirm('Are you sure you want to delete this incident record?')) return;

      if (API_CONFIG.AUTH_TOKEN !== 'PASTE_YOUR_NOCODB_TOKEN_HERE') {
        await fetch(`${API_CONFIG.BASE_URL}${API_CONFIG.INCIDENTS_ENDPOINT}/${id}`, {
          method: 'DELETE',
          headers: { 'xc-token': API_CONFIG.AUTH_TOKEN }
        });
        fetchData();
      } else {
        state.incidents = state.incidents.filter(i => i.id !== id);
        render();
      }
    }

    }
  </script>
